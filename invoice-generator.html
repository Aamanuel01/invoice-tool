<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freelancer Invoice Generator</title>
<style>
:root{--ink:#14213d;--paper:#fff;--bg:#eef3f8;--line:#d5deea;--acc:#fca311;--muted:#5b6b85}
@media (prefers-color-scheme:dark){:root{--ink:#e8eefb;--paper:#1b2740;--bg:#0f1729;--line:#2c3b5a;--muted:#9fb0cc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:24px auto;padding:0 16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:6px}
button.p{background:var(--acc);border-color:var(--acc);color:#14213d;font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.inv{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 2px}
input,textarea{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical;min-height:60px}
table{width:100%;border-collapse:collapse;margin-top:22px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:2px solid var(--ink)}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
td input{border-color:transparent}
td input:hover{border-color:var(--line)}
.n{text-align:right}
.tot{margin:18px 0 0 auto;width:260px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .g{border-top:2px solid var(--ink);font-size:18px;font-weight:700;margin-top:6px;padding-top:8px}
.x{padding:2px 8px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:600px){.row{grid-template-columns:1fr}.inv{padding:16px}}
@media print{body{background:#fff;color:#000}.bar,.x,.add,.hint{display:none}.inv{border:0;padding:0;background:#fff}input,textarea{border-color:transparent!important;resize:none}:root{--ink:#000;--line:#ccc;--muted:#555}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Invoice Generator</h1>
    <div><button id="clr">New invoice</button> <button class="p" id="prt">Save as PDF / Print</button></div>
  </div>
  <div class="inv">
    <div class="row">
      <div>
        <label>From (your name / business)</label><input id="from" placeholder="Jane Doe Design">
        <label>Your email / address</label><textarea id="fromAddr" placeholder="jane@email.com"></textarea>
      </div>
      <div>
        <label>Invoice #</label><input id="num" value="INV-001">
        <label>Issue date</label><input id="date" type="date">
        <label>Due date</label><input id="due" type="date">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Bill to</label><input id="to" placeholder="Client name">
        <label>Client email / address</label><textarea id="toAddr"></textarea>
      </div>
      <div>
        <label>Currency symbol</label><input id="cur" value="$" maxlength="3">
        <label>Tax rate (%)</label><input id="tax" type="number" value="0" min="0" step="0.1">
      </div>
    </div>
    <table>
      <thead><tr><th>Description</th><th class="n" style="width:80px">Qty</th><th class="n" style="width:110px">Rate</th><th class="n" style="width:110px">Amount</th><th style="width:30px"></th></tr></thead>
      <tbody id="items"></tbody>
    </table>
    <button class="add" id="add" style="margin-top:8px">+ Add line</button>
    <div class="tot">
      <div><span>Subtotal</span><span id="sub"></span></div>
      <div><span>Tax</span><span id="tx"></span></div>
      <div class="g"><span>Total due</span><span id="total"></span></div>
    </div>
    <label>Notes / payment details</label>
    <textarea id="notes" placeholder="Bank details, PayPal link, thank-you note"></textarea>
    <p class="hint">Everything saves automatically in this browser. Use Print → Save as PDF to send.</p>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='invoice-gen-v1';
const fields=['from','fromAddr','num','date','due','to','toAddr','cur','tax','notes'];
let rows=[{d:'',q:1,r:0}];
const today=new Date().toISOString().slice(0,10);
$('date').value=today;

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!s)return;
    fields.forEach(f=>{if(s[f]!==undefined)$(f).value=s[f]});
    if(s.rows&&s.rows.length)rows=s.rows;
  }catch(e){}
}
function save(){
  try{
    const s={rows};
    fields.forEach(f=>s[f]=$(f).value);
    localStorage.setItem(KEY,JSON.stringify(s));
  }catch(e){}
}
const money=n=>$('cur').value+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function render(){
  $('items').innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><input data-i="${i}" data-k="d" placeholder="Service or product"></td>
    <td><input class="n" type="number" min="0" step="any" data-i="${i}" data-k="q"></td>
    <td><input class="n" type="number" min="0" step="any" data-i="${i}" data-k="r"></td>
    <td class="n amt" style="padding-top:11px"></td>
    <td><button class="x" data-del="${i}" aria-label="Remove line">×</button></td>`;
    tr.querySelectorAll('input').forEach(inp=>inp.value=rows[i][inp.dataset.k]);
    $('items').appendChild(tr);
  });
  calc();
}
function calc(){
  let sub=0;
  document.querySelectorAll('#items tr').forEach((tr,i)=>{
    const a=(+rows[i].q||0)*(+rows[i].r||0);
    sub+=a;
    tr.querySelector('.amt').textContent=money(a);
  });
  const tx=sub*(+$('tax').value||0)/100;
  $('sub').textContent=money(sub);
  $('tx').textContent=money(tx);
  $('total').textContent=money(sub+tx);
  save();
}
$('items').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i===undefined)return;
  rows[t.dataset.i][t.dataset.k]=t.dataset.k==='d'?t.value:t.value;
  calc();
});
$('items').addEventListener('click',e=>{
  const i=e.target.dataset.del;
  if(i===undefined)return;
  rows.splice(i,1);
  if(!rows.length)rows.push({d:'',q:1,r:0});
  render();
});
$('add').onclick=()=>{rows.push({d:'',q:1,r:0});render()};
$('prt').onclick=()=>window.print();
$('clr').onclick=()=>{
  if(!confirm('Start a new invoice? Current one will be cleared.'))return;
  const m=($('num').value.match(/^(.*?)(\d+)$/));
  const next=m?m[1]+String(+m[2]+1).padStart(m[2].length,'0'):'INV-001';
  fields.forEach(f=>{if(!['from','fromAddr','cur','tax','notes'].includes(f))$(f).value=''});
  $('num').value=next;$('date').value=today;
  rows=[{d:'',q:1,r:0}];render();
};
fields.forEach(f=>$(f).addEventListener('input',calc));
load();render();
</script>
</body>
</html>
